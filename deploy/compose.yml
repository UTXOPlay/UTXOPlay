services:
  store:
    image: utxoplay:0.32.0
    container_name: utxoplay-store
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_ORIGIN: https://store.utxoplay.io
      VIRTUAL_HOST: store.utxoplay.io,utxoplay.io,www.utxoplay.io
      VIRTUAL_PORT: '8790'
      MYELIN_CHESS_URL: http://myelin-chess:8080
      MYELIN_SLING_URL: http://myelin-sling:8080
      MYELIN_TEEWORLDS_URL: http://myelin-teeworlds:8080
      MYELIN_OPENSTRIKE_URL: http://myelin-openstrike:8080
      MYELIN_ARCADE_URL: http://myelin-arcade:8080
      MYELIN_NEON_MINER_URL: http://myelin-neon-miner:8080
      MYELIN_PRISM_BREAKER_URL: http://myelin-prism-breaker:8080
      MYELIN_ATELIER_URL: http://myelin-atelier:8080
    env_file: /data/utxoplay/shared/runtime.env
    volumes:
      - /data/utxoplay/shared/platform:/app/data
    networks:
      - edge
      - games
    mem_limit: 384m
    cpus: '0.75'
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=32m]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8790/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge: {external: true, name: stack-network}
  games: {external: true, name: utxoplay-games}
